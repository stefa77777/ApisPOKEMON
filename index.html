<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeApi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>PokeApi</h1>
        <div class="search-bar">
            <input type="text" id="campoBusqueda" placeholder="Buscar por nombre o número...">
            <button id="botonBuscar">Buscar</button>
            <button id="botonFavoritos">Ver Favoritos</button>
        </div>
    </header>

    <main>

        <div id="cargando">Cargando Pokémon...</div>

        <div id="error" style="display: none; color: white; text-align: center; margin: 20px 0;"></div>

        <div id="pokemon-detalle"></div>

        <div id="pokemon-grid"></div>

        <div id="favoritos-grid" style="display: none;"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
